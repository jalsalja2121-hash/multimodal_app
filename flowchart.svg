<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 790" width="1380" height="790"
     font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <filter id="phoneShadow" x="-15%" y="-5%" width="135%" height="118%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00000030"/>
    </filter>
    <marker id="navArrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6366f1"/>
    </marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <clipPath id="clip1"><rect x="82" y="128" width="236" height="522" rx="4"/></clipPath>
    <clipPath id="clip2"><rect x="572" y="128" width="236" height="522" rx="4"/></clipPath>
    <clipPath id="clip3"><rect x="1062" y="128" width="236" height="522" rx="4"/></clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="1380" height="790" fill="#e8edf5"/>

  <!-- ── Title ── -->
  <text x="690" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Multimodal App — 화면 플로우차트</text>
  <text x="690" y="62" text-anchor="middle" font-size="12" fill="#64748b">실제 화면 기반 네비게이션 흐름 (input_screen → stt_screen → llm_screen)</text>

  <!-- ── Step badges ── -->
  <circle cx="200" cy="92" r="15" fill="#3b82f6"/>
  <text x="200" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="white">1</text>
  <circle cx="690" cy="92" r="15" fill="#16a34a"/>
  <text x="690" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="white">2</text>
  <circle cx="1180" cy="92" r="15" fill="#ea580c"/>
  <text x="1180" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="white">3</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  PHONE 1 — 입력 화면                              -->
  <!-- ══════════════════════════════════════════════════ -->
  <!-- Frame -->
  <rect x="70" y="110" width="260" height="560" rx="32" fill="#18223a" filter="url(#phoneShadow)"/>
  <!-- Side buttons -->
  <rect x="58"  y="212" width="7" height="28" rx="3.5" fill="#2a3a56"/>
  <rect x="58"  y="250" width="7" height="28" rx="3.5" fill="#2a3a56"/>
  <rect x="333" y="230" width="7" height="42" rx="3.5" fill="#2a3a56"/>
  <!-- Notch -->
  <rect x="148" y="118" width="104" height="16" rx="8" fill="#0c1322"/>
  <!-- Screen -->
  <rect x="82" y="128" width="236" height="522" rx="4" fill="#f3f4f6"/>

  <!-- AppBar 1 -->
  <rect x="82" y="128" width="236" height="48" fill="white" clip-path="url(#clip1)"/>
  <text x="96" y="158" font-size="17" font-weight="600" fill="#111827">입력</text>
  <line x1="82" y1="176" x2="318" y2="176" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Gray image area -->
  <rect x="82" y="176" width="236" height="370" fill="#e8eaed" clip-path="url(#clip1)"/>
  <!-- Image placeholder icon -->
  <rect x="172" y="318" width="56" height="42" rx="5" fill="#cdd0d5"/>
  <circle cx="184" cy="332" r="5.5" fill="#9ca3af"/>
  <polygon points="172,360 197,338 214,350 228,360" fill="#b0b6be"/>
  <text x="200" y="393" text-anchor="middle" font-size="11.5" fill="#9ca3af">사진을 찍어보세요</text>

  <!-- Button area 1 -->
  <rect x="82" y="546" width="236" height="104" fill="white" clip-path="url(#clip1)"/>
  <line x1="82" y1="546" x2="318" y2="546" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Row 1: 카메라 | 갤러리 -->
  <rect x="92" y="556" width="106" height="34" rx="17" fill="#f0f4ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="145" y="578" text-anchor="middle" font-size="11.5" fill="#4338ca">카메라</text>
  <rect x="207" y="556" width="104" height="34" rx="17" fill="#f0f4ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="259" y="578" text-anchor="middle" font-size="11.5" fill="#4338ca">갤러리</text>
  <!-- Row 2: 음성 입력으로 이동 -->
  <rect x="92" y="598" width="220" height="36" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="202" y="621" text-anchor="middle" font-size="11.5" fill="#1d4ed8">음성 입력으로 이동</text>

  <!-- Home bar 1 -->
  <rect x="160" y="648" width="80" height="4" rx="2" fill="#374151"/>

  <!-- Label 1 -->
  <text x="200" y="702" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">입력 화면</text>
  <text x="200" y="719" text-anchor="middle" font-size="11" fill="#64748b">input_screen.dart</text>

  <!-- ── Arrow 1 → 2 ── -->
  <line x1="338" y1="395" x2="554" y2="395"
        stroke="#6366f1" stroke-width="2.5" stroke-dasharray="7,4"
        marker-end="url(#navArrow)"/>
  <circle cx="446" cy="395" r="3.5" fill="#6366f1" opacity="0.5"/>
  <rect x="362" y="368" width="168" height="20" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="446" y="382" text-anchor="middle" font-size="9.5" fill="#4f46e5" font-weight="600">음성 입력으로 이동 버튼</text>
  <text x="446" y="417" text-anchor="middle" font-size="9" fill="#94a3b8">Navigator.push(SttScreen)</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  PHONE 2 — 음성 입력 화면                         -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="560" y="110" width="260" height="560" rx="32" fill="#18223a" filter="url(#phoneShadow)"/>
  <rect x="548"  y="212" width="7" height="28" rx="3.5" fill="#2a3a56"/>
  <rect x="548"  y="250" width="7" height="28" rx="3.5" fill="#2a3a56"/>
  <rect x="823"  y="230" width="7" height="42" rx="3.5" fill="#2a3a56"/>
  <rect x="638"  y="118" width="104" height="16" rx="8" fill="#0c1322"/>
  <!-- Screen -->
  <rect x="572" y="128" width="236" height="522" rx="4" fill="#f8fafc"/>

  <!-- AppBar 2 -->
  <rect x="572" y="128" width="236" height="48" fill="white" clip-path="url(#clip2)"/>
  <text x="584" y="156" font-size="20" fill="#374151">&#8592;</text>
  <text x="690" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">음성 입력</text>
  <line x1="572" y1="176" x2="808" y2="176" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Content area 2 — large light space -->
  <rect x="572" y="176" width="236" height="370" fill="#f8fafc" clip-path="url(#clip2)"/>

  <!-- Centered placeholder text -->
  <text x="690" y="376" text-anchor="middle" font-size="12" fill="#6b7280">마이크 버튼을 눌러보세요</text>

  <!-- Button area 2 -->
  <rect x="572" y="546" width="236" height="104" fill="white" clip-path="url(#clip2)"/>
  <line x1="572" y1="546" x2="808" y2="546" stroke="#e5e7eb" stroke-width="1"/>
  <!-- 마이크 시작 | 분석 화면으로 이동 -->
  <rect x="580" y="558" width="106" height="34" rx="17" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="633" y="580" text-anchor="middle" font-size="11" fill="#15803d">마이크 시작</text>
  <rect x="696" y="558" width="110" height="34" rx="17" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
  <text x="751" y="580" text-anchor="middle" font-size="9.5" fill="#0369a1">분석 화면으로 이동</text>
  <!-- Listening state text -->
  <text x="690" y="612" text-anchor="middle" font-size="9" fill="#d1d5db">듣는 중... (탭하여 중지)</text>

  <!-- Home bar 2 -->
  <rect x="650" y="648" width="80" height="4" rx="2" fill="#374151"/>

  <!-- Label 2 -->
  <text x="690" y="702" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">음성 입력 화면</text>
  <text x="690" y="719" text-anchor="middle" font-size="11" fill="#64748b">stt_screen.dart</text>

  <!-- ── Arrow 2 → 3 ── -->
  <line x1="828" y1="395" x2="1044" y2="395"
        stroke="#6366f1" stroke-width="2.5" stroke-dasharray="7,4"
        marker-end="url(#navArrow)"/>
  <circle cx="936" cy="395" r="3.5" fill="#6366f1" opacity="0.5"/>
  <rect x="852" y="368" width="168" height="20" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="936" y="382" text-anchor="middle" font-size="9.5" fill="#4f46e5" font-weight="600">분석 화면으로 이동 버튼</text>
  <text x="936" y="417" text-anchor="middle" font-size="9" fill="#94a3b8">Navigator.push(LlmScreen)</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  PHONE 3 — 분석 화면                              -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="1050" y="110" width="260" height="560" rx="32" fill="#18223a" filter="url(#phoneShadow)"/>
  <rect x="1038"  y="212" width="7" height="28" rx="3.5" fill="#2a3a56"/>
  <rect x="1038"  y="250" width="7" height="28" rx="3.5" fill="#2a3a56"/>
  <rect x="1313"  y="230" width="7" height="42" rx="3.5" fill="#2a3a56"/>
  <rect x="1128"  y="118" width="104" height="16" rx="8" fill="#0c1322"/>
  <!-- Screen -->
  <rect x="1062" y="128" width="236" height="522" rx="4" fill="white"/>

  <!-- AppBar 3 -->
  <rect x="1062" y="128" width="236" height="48" fill="white" clip-path="url(#clip3)"/>
  <text x="1074" y="156" font-size="20" fill="#374151">&#8592;</text>
  <text x="1180" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">분석</text>
  <line x1="1062" y1="176" x2="1298" y2="176" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Book image area -->
  <rect x="1062" y="176" width="236" height="152" fill="#b8cfe4" clip-path="url(#clip3)"/>
  <!-- Desk/table surface -->
  <rect x="1062" y="294" width="236" height="34" fill="#8b7042" opacity="0.35" clip-path="url(#clip3)"/>
  <!-- Book body -->
  <rect x="1098" y="182" width="152" height="128" rx="5" fill="#f0ebe0" clip-path="url(#clip3)"/>
  <!-- Book cover gradient area -->
  <rect x="1103" y="187" width="142" height="80" rx="3" fill="#e2d9c4" clip-path="url(#clip3)"/>
  <!-- Red box (object detection box) -->
  <rect x="1108" y="192" width="42" height="38" rx="2" fill="none" stroke="#e53e3e" stroke-width="2.5"/>
  <!-- Blue box (object detection box) -->
  <rect x="1120" y="200" width="36" height="28" rx="2" fill="none" stroke="#3182ce" stroke-width="2"/>
  <!-- Brain icon simplified -->
  <ellipse cx="1127" cy="210" rx="8" ry="7" fill="#fc8181" opacity="0.8"/>
  <!-- Book title -->
  <text x="1174" y="250" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d3748">컴퓨터 비전과</text>
  <text x="1174" y="264" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d3748">딥러닝</text>
  <!-- DEEP LEARNING sub text -->
  <text x="1244" y="216" text-anchor="middle" font-size="6" fill="#718096">DEEP</text>
  <text x="1244" y="224" text-anchor="middle" font-size="6" fill="#718096">LEARNING</text>
  <!-- Cat silhouette (simplified) -->
  <ellipse cx="1242" cy="234" rx="12" ry="10" fill="#a0aec0" opacity="0.6"/>
  <polygon points="1232,226 1237,216 1241,226" fill="#a0aec0" opacity="0.6"/>
  <polygon points="1244,226 1248,216 1252,226" fill="#a0aec0" opacity="0.6"/>

  <!-- ─ Gap between image and card ─ -->

  <!-- Blue 현재 상태 card -->
  <rect x="1068" y="336" width="224" height="86" rx="11" fill="#dbeafe" clip-path="url(#clip3)"/>
  <text x="1082" y="356" font-size="11" font-weight="bold" fill="#1d4ed8">현재 상태</text>
  <text x="1082" y="372" font-size="8.2" fill="#1e40af">이미지에는 신규 도입될 것으로 보이는</text>
  <text x="1082" y="384" font-size="8.2" fill="#1e40af">장비와 현재 사용 중인 조명 스탠드가</text>
  <text x="1082" y="396" font-size="8.2" fill="#1e40af">보입니다. 다양한 장비가 혼재되어 있어</text>
  <text x="1082" y="408" font-size="8.2" fill="#1e40af">각 장비의 관리가 필요함을 시사합니다.</text>

  <!-- 필요 조치 row -->
  <rect x="1068" y="428" width="224" height="34" rx="7" fill="white" stroke="#e5e7eb" stroke-width="1" clip-path="url(#clip3)"/>
  <line x1="1148" y1="428" x2="1148" y2="462" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1082" y="450" font-size="8.5" fill="#9ca3af">필요 조치</text>
  <text x="1157" y="450" font-size="9" font-weight="600" fill="#111827">재고 등록, 정기 점검, 환경</text>

  <!-- 상세 row -->
  <rect x="1068" y="468" width="224" height="34" rx="7" fill="white" stroke="#e5e7eb" stroke-width="1" clip-path="url(#clip3)"/>
  <line x1="1148" y1="468" x2="1148" y2="502" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1082" y="490" font-size="8.5" fill="#9ca3af">상세</text>
  <text x="1157" y="490" font-size="9" font-weight="600" fill="#111827">자산 관리, 효율성, 안전성</text>

  <!-- 다시 분석 button -->
  <rect x="1098" y="514" width="164" height="36" rx="18" fill="#f1f5f9" stroke="#d1d5db" stroke-width="1.5" clip-path="url(#clip3)"/>
  <text x="1180" y="537" text-anchor="middle" font-size="12" fill="#374151">다시 분석</text>

  <!-- Re-analyze loop arrow (outside phone, right side) -->
  <path d="M 1262 532 C 1355 532 1355 344 1268 344"
        fill="none" stroke="#f97316" stroke-width="2"
        stroke-dasharray="5,4" marker-end="url(#loopArrow)"/>
  <rect x="1300" y="420" width="70" height="20" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="1335" y="433" text-anchor="middle" font-size="9" fill="#c2410c" font-weight="600">🔄 재분석</text>

  <!-- Home bar 3 -->
  <rect x="1140" y="648" width="80" height="4" rx="2" fill="#374151"/>

  <!-- Label 3 -->
  <text x="1180" y="702" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">분석 화면</text>
  <text x="1180" y="719" text-anchor="middle" font-size="11" fill="#64748b">llm_screen.dart</text>

  <!-- ── Riverpod state footer ── -->
  <rect x="180" y="741" width="1020" height="36" rx="9" fill="white" stroke="#e2e8f0" stroke-width="1" opacity="0.92"/>
  <text x="690" y="754" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">RIVERPOD 상태 공유</text>
  <text x="690" y="769" text-anchor="middle" font-size="10.5" fill="#475569">
    💾 imageProvider (입력 화면 → 분석 화면)　|　🎙 speechTextProvider (음성 화면 → 분석 화면)
  </text>

</svg>
